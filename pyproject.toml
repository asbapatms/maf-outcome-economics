[project]
name = "maf-outcome-economics"
version = "0.1.0"
description = "Outcome economics analysis with Microsoft Agent Framework"
readme = "README.md"
authors = [
    { name = "Ashwini Bapat", email = "asbapat@microsoft.com" }
]
requires-python = ">=3.11"
dependencies = [
    "agent-framework==1.11.0",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry-exporter>=1.0.0b56",
    "cryptography==46.0.3",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<1.44.0",
    "opentelemetry-sdk>=1.43.0,<1.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
maf-outcome-economics = "maf_outcome_economics.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
    "tqdm>=4.70.0",
]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true
